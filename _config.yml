# GitHub Pages (Jekyll): interne Dateien nicht veröffentlichen.
# Ordner/Dateien mit "_" oder "." am Anfang ignoriert Jekyll ohnehin – hier zusätzlich explizit.
exclude:
  - package.json
  - package-lock.json
  - node_modules
  - BILDER-TODO.md
  - SEO-TODO.md
  - README.md
  - assets/vorher-nachher/README.md
  - _src
  - .claude
  - .gstack
